spring:
  profiles:
    active: dev

  application:
    name: springAI-project
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com # 服务地址
      chat:
        model: deepseek-flash # 模型名称

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring_ai?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false&remarks=true&useInformationSchema=true
    username: root
    password: 123456
logging:
  level:
    org.springframework.ai: debug # AI对话的日志级别
    com.example.ai: debug # 本项目的日志级别